---
name: call-build-and-deploy
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to (dev, staging, prod)'
        required: true
        type: string
      ref:
        description: 'Git ref to build (e.g. PR head SHA). Omit to use triggering ref.'
        required: false
        type: string
      image_version:
        description: 'The version tag of the payload:<version> image'
        required: true
        type: string
    secrets:
      FONTAWESOME_TOKEN:
        required: true
      CONTAINER_REGISTRY_PASS:
        required: true
      CONTAINER_REGISTRY_USER:
        required: true
      CONTAINER_REGISTRY_URL:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_RESOURCE_GROUP:
        required: true
      AZURE_APP_SERVICE_ID:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Create .npmrc for FontAwesome (host, for build step)
        run: |
          printf "@fortawesome:registry=https://npm.fontawesome.com/\n" > .npmrc
          printf "//npm.fontawesome.com/:_authToken=%s\n" "${{ secrets.FONTAWESOME_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Application Build
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          pnpm generate:types
          pnpm generate:importmap
          pnpm build

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            --secret id=npmrc,src=.npmrc \
            -t payload:${{ inputs.image_version }} .

      - name: Deploy
        uses: Sport-Auto-Plus-GmbH/infrastructure/.github/actions/released@main
        with:
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          container_registry_url: ${{ secrets.CONTAINER_REGISTRY_URL }}
          container_registry_user: ${{ secrets.CONTAINER_REGISTRY_USER }}
          container_registry_password: ${{ secrets.CONTAINER_REGISTRY_PASS }}
          image_name: payload
          image_tag: ${{ inputs.image_version }}
          app_service_resource_group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          app_service_id: ${{ secrets.AZURE_APP_SERVICE_ID }}
