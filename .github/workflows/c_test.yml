---
name: call-test
on:
  workflow_call:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (with coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: saplus_dev
          POSTGRES_PASSWORD: saplus_dev
          POSTGRES_DB: datendrehscheibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Create .npmrc for FontAwesome
        run: |
          printf "@fortawesome:registry=https://npm.fontawesome.com/\n" > .npmrc
          printf "//npm.fontawesome.com/:_authToken=%s\n" "${{ secrets.FONTAWESOME_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to the test database
        env:
          DATABASE_URL: postgres://saplus_dev:saplus_dev@localhost:5432/datendrehscheibe_test
          DATABASE_SCHEMA: payload
          PAYLOAD_SECRET: test-secret-do-not-use-in-production
        # `payload migrate` may ask for a y/N confirmation on a schema change; there's no
        # TTY in CI to answer it, so pre-answer yes rather than let the job hang.
        run: yes | pnpm migrate

      - name: Run tests with coverage
        run: pnpm test:coverage
